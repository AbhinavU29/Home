version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: prasanth_jewellery_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespwd123
      POSTGRES_DB: prasanth_jewellery
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: prasanth_jewellery_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespwd123@db:5432/prasanth_jewellery
      - SECRET_KEY=7b6bcf36a8e8db6d953931be6f8df7f0c1a9f5d14e308f2a969f6cd9e89b4e54
    depends_on:
      - db
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    container_name: prasanth_jewellery_frontend
    restart: always
    ports:
      - "5173:5173"
    stdin_open: true
    tty: true
    depends_on:
      - backend

volumes:
  pgdata:
